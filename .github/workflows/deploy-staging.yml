name: CI & Deploy (staging)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run auth:schema:check -w apps/worker
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - name: Apply D1 migrations to staging
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --env staging --remote
      - name: Deploy Worker + assets to staging
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
        run: npx wrangler deploy --env staging --var GIT_SHA:$GIT_SHA
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://staging.uno.example.com/api/health && exit 0
            sleep 5
          done
          exit 1
      - name: Signed-out /api/me is 401
        run: test "$(curl -s -o /dev/null -w '%{http_code}' https://staging.uno.example.com/api/me)" = "401"
      - name: End-to-end sign-in (Playwright)
        env:
          BASE_URL: https://staging.uno.example.com
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
          E2E_EMAIL_DOMAIN: ${{ vars.E2E_EMAIL_DOMAIN }}
          EXPECT_GOOGLE: "1"
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
